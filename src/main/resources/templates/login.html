<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Login</title></head>
<body>
    <h2>Login do Sistema</h2>
    <p th:if="${param.error}" style="color:red">Usuário ou senha inválidos.</p>
    <p th:if="${param.logout}">Você saiu do sistema.</p>
    <form th:action="@{/login}" method="post">
        <div><label>Usuário: <input type="text" name="username"/></label></div>
        <div><label>Senha: <input type="password" name="password"/></label></div>
        <button type="submit">Entrar</button>
    </form>
    <a th:href="@{/cadastro}">Ainda não tem conta? Cadastre-se</a>
</body>
</html>
